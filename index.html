<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coloriage numéroté</title>
<style>
:root{--bg:#fbf7f0;--ink:#2b2438;--bar:#fff;--line:#e3dccf;--acc:#e0457b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--ink:#f1ecf7;--bar:#241f31;--line:#383048}}
:root[data-theme="dark"]{--bg:#17141f;--ink:#f1ecf7;--bar:#241f31;--line:#383048}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
header b{flex:1;font-size:15px}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;min-width:40px;height:40px;font-size:17px;font-weight:700}
.btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#prog{height:5px;background:var(--line)}#prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
#wrap{flex:1;overflow:auto;background:var(--bg);text-align:center;position:relative}
canvas{display:block;margin:0 auto;touch-action:manipulation;background:#fff}
#pal{display:flex;gap:10px;overflow-x:auto;padding:10px 12px;background:var(--bar);border-top:1px solid var(--line)}
.sw{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:3px solid transparent;font-weight:800;font-size:17px;display:grid;place-items:center;position:relative;box-shadow:0 0 0 1px var(--line)}
.sw.sel{border-color:var(--acc);transform:scale(1.14)}
.sw.ok{opacity:.35}
.sw small{position:absolute;right:-4px;top:-5px;background:var(--ink);color:var(--bg);border-radius:9px;font-size:10px;padding:1px 5px}
#msg{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#msg.show{opacity:1}
#win{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.55);z-index:5}
#win div{background:var(--bar);padding:26px;border-radius:18px;text-align:center;max-width:80%}
#win h2{margin:0 0 8px}
</style></head><body>
<header><b>Coloriage numéroté</b><button class="btn" id="zo">−</button><button class="btn" id="zi">+</button><button class="btn" id="orig" title="Modèle">🖼</button><button class="btn" id="hint" title="Indice">💡</button></header>
<div id="prog"><i></i></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="pal"></div>
<img id="ov" alt="" style="display:none;position:fixed;left:50%;top:60px;transform:translateX(-50%);max-height:60%;max-width:80%;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:4"><div id="msg"></div>
<div id="win"><div><h2>Bravo ! 🎉</h2><p>Ton image est terminée.</p><button class="btn" style="padding:0 18px" id="again">Recommencer</button> <button class="btn" style="padding:0 18px" id="close">Admirer</button></div></div>

const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
let H,lab,reg,regs,painted,pal,sel=0,done=0,zoom=1,hint=false,numPos;
const $=id=>document.getElementById(id);
function msg(t){const m=$('msg');m.textContent=t;m.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>m.classList.remove('show'),1100)}
const img=new Image();img.onload=()=>{wrap.insertAdjacentHTML('afterbegin','<p id="ld" style="padding:14px">Préparation du coloriage…</p>');setTimeout(()=>{try{init();$('ld').remove()}catch(e){$('ld').textContent='Erreur : '+e.message}},60)};img.src=SRC;
function init(){
 H=Math.round(W*img.height/img.width);
 const o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');
 x.drawImage(img,0,0,W,H);const d=x.getImageData(0,0,W,H).data,N=W*H;
 const px=new Float32Array(N*3);for(let i=0;i<N;i++){px[i*3]=d[i*4];px[i*3+1]=d[i*4+1];px[i*3+2]=d[i*4+2]}
 const L=p=>.3*p[0]+.59*p[1]+.11*p[2];
 const S=[];for(let i=0;i<N;i+=3)S.push(i);const M=S.length;
 let sd=12345;const rnd=()=>(sd=(sd*1664525+1013904223)>>>0)/4294967296;
 const cen=new Float32Array(K*3);let f=S[Math.floor(rnd()*M)]*3;cen[0]=px[f];cen[1]=px[f+1];cen[2]=px[f+2];
 const d2=new Float64Array(M).fill(1e18);
 for(let k=1;k<K;k++){const o=(k-1)*3;let tot=0;for(let s=0;s<M;s++){const i=S[s]*3,e=(px[i]-cen[o])**2+(px[i+1]-cen[o+1])**2+(px[i+2]-cen[o+2])**2;if(e<d2[s])d2[s]=e;tot+=d2[s]}let r=rnd()*tot,j=0;for(;j<M-1;j++){r-=d2[j];if(r<=0)break}const i=S[j]*3;cen[k*3]=px[i];cen[k*3+1]=px[i+1];cen[k*3+2]=px[i+2]}
 const near=i=>{const r=px[i*3],g=px[i*3+1],b=px[i*3+2];let best=0,bd=1e18;for(let k=0;k<K;k++){const e=(r-cen[k*3])**2+(g-cen[k*3+1])**2+(b-cen[k*3+2])**2;if(e<bd){bd=e;best=k}}return best};
 for(let it=0;it<20;it++){const s=new Float64Array(K*4);for(let t=0;t<M;t++){const i=S[t],k=near(i);s[k*4]+=px[i*3];s[k*4+1]+=px[i*3+1];s[k*4+2]+=px[i*3+2];s[k*4+3]++}
  for(let k=0;k<K;k++)if(s[k*4+3]){cen[k*3]=s[k*4]/s[k*4+3];cen[k*3+1]=s[k*4+1]/s[k*4+3];cen[k*3+2]=s[k*4+2]/s[k*4+3]}}
 lab=new Int32Array(N);for(let i=0;i<N;i++)lab[i]=near(i);
 const cl=[];for(let k=0;k<K;k++)cl.push([cen[k*3],cen[k*3+1],cen[k*3+2]]);

 pal=ord.map(k=>cl[k].map(Math.round));for(let i=0;i<N;i++)lab[i]=map[lab[i]];
 for(let p=0;p<0;p++){const n=lab.slice();for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const c=new Array(K).fill(0);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const a=xx+dx,b=y+dy;if(a>=0&&b>=0&&a<W&&b<H)c[lab[b*W+a]]++}let best=lab[y*W+xx];for(let k=0;k<K;k++)if(c[k]>c[best])best=k;n[y*W+xx]=best}lab=n}
 for(let r=0;r<6;r++){comps();let ch=false;
  for(const g of regs){if(g.cells.length>=MIN)continue;const c=new Array(K).fill(0);
   for(const i of g.cells){const xx=i%W,y=(i/W)|0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const a=xx+dx,b=y+dy;if(a>=0&&b>=0&&a<W&&b<H&&reg[b*W+a]!==reg[i])c[lab[b*W+a]]++})}
   const m=[0,0,0];for(const i of g.cells){m[0]+=px[i*3];m[1]+=px[i*3+1];m[2]+=px[i*3+2]}const n=g.cells.length;let best=-1,bv=1e18;for(let k=0;k<K;k++)if(c[k]>0){const e=(m[0]/n-pal[k][0])**2+(m[1]/n-pal[k][1])**2+(m[2]/n-pal[k][2])**2;if(e<bv){bv=e;best=k}}

function comps(){reg=new Int32Array(W*H).fill(-1);regs=[];

   [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const a=x+dx,b=y+dy;if(a<0||b<0||a>=W||b>=H)return;const n=b*W+a;if(reg[n]<0&&lab[n]===lab[i]){reg[n]=id;st.push(n)}})}
  regs.push({l:lab[i],cells})}}
function numbers(){
 const dist=new Int32Array(W*H),q=[];const nb=[[1,0],[-1,0],[0,1],[0,-1]];
 for(let i=0;i<W*H;i++){const x=i%W,y=(i/W)|0;let edge=false;
  for(const[dx,dy]of nb){const a=x+dx,b=y+dy;if(a<0||b<0||a>=W||b>=H||reg[b*W+a]!==reg[i])edge=true}
  if(edge){dist[i]=1;q.push(i)}}
 for(let h=0;h<q.length;h++){const j=q[h],x=j%W,y=(j/W)|0;
  for(const[dx,dy]of nb){const a=x+dx,b=y+dy;if(a<0||b<0||a>=W||b>=H)continue;const n=b*W+a;if(!dist[n]&&reg[n]===reg[j]){dist[n]=dist[j]+1;q.push(n)}}}

 $('win').style.display='none';

function buildPal(){const p=$('pal');p.innerHTML='';
 pal.forEach((c,k)=>{const b=document.createElement('div');b.className='sw';b.id='sw'+k;b.style.background=`rgb(${c})`;
  b.style.color=(.3*c[0]+.59*c[1]+.11*c[2])>140?'#000':'#fff';b.innerHTML=(k+1)+'<small></small>';
  b.onclick=()=>{sel=k;upd();draw()};p.appendChild(b)})}
function upd(){
 const left=new Array(K).fill(0);regs.forEach((g,i)=>{if(!painted[i])left[g.l]++});
 pal.forEach((_,k)=>{const b=$('sw'+k);b.classList.toggle('sel',k===sel);b.classList.toggle('ok',left[k]===0);b.querySelector('small').textContent=left[k]||'✓'});
 $('prog').firstChild.style.width=(done/regs.length*100)+'%'}
function draw(){
 ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
 for(let i=0;i<W*H;i++){const x=i%W,y=(i/W)|0,r=reg[i];
  ctx.fillStyle=painted[r]?`rgb(${pal[lab[i]]})`:(hint&&lab[i]===sel?'#ffe36e':'#fafafa');
  ctx.fillRect(x*C,y*C,C,C)}
 for(let i=0;i<W*H;i++){const x=i%W,y=(i/W)|0,r=reg[i];
  if(x<W-1&&reg[i+1]!==r){ctx.fillStyle=painted[r]&&painted[reg[i+1]]?'rgba(0,0,0,.08)':'#9a9a9a';ctx.fillRect(x*C+C-.5,y*C,1,C)}
  if(y<H-1&&reg[i+W]!==r){ctx.fillStyle=painted[r]&&painted[reg[i+W]]?'rgba(0,0,0,.08)':'#9a9a9a';ctx.fillRect(x*C,y*C+C-.5,C,1)}}
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#444';
 regs.forEach((g,i)=>{if(painted[i])return;const p=numPos[i],fs=Math.max(7,Math.min(C*1.7,C*p.d*1.4));
  ctx.font=`bold ${fs}px sans-serif`;ctx.fillText(g.l+1,p.x*C+C/2,p.y*C+C/2+.5)})}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);
 if(x<0||y<0||x>=W||y>=H)return;const id=reg[y*W+x];if(painted[id])return;
 if(regs[id].l===sel){painted[id]=1;done++;draw();upd();if(done===regs.length)setTimeout(()=>$('win').style.display='grid',400)}
 else{msg('Ce n’est pas la couleur '+(sel+1)+' : cette zone est le '+(regs[id].l+1));navigator.vibrate&&navigator.vibrate(60)}});
function layout(){const f=Math.min(wrap.clientWidth/cv.width,wrap.clientHeight/cv.height);cv.style.width=cv.width*f*zoom+'px';cv.style.margin=zoom>1?'0':'0 auto'}
function zm(f){zoom=Math.min(8,Math.max(1,zoom*f));layout()}
addEventListener('resize',layout);
$('orig').onclick=()=>{const o=$('ov');o.src=SRC;o.style.display=o.style.display==='block'?'none':'block'};
$('zi').onclick=()=>zm(1.4);$('zo').onclick=()=>zm(1/1.4);
$('hint').onclick=function(){hint=!hint;this.classList.toggle('on',hint);draw()};
$('again').onclick=()=>reset(false);$('close').onclick=()=>$('win').style.display='none';
